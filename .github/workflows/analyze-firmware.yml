name: Analyze firmware

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install analysis tools
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full file binutils e2fsprogs android-sdk-libsparse-utils abootimg jq tree

      - name: Download firmware release asset
        run: |
          mkdir -p downloaded
          gh release download firmware-v1 --repo "$GITHUB_REPOSITORY" --dir downloaded
          ls -lah downloaded

      - name: Analyze firmware read-only
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p analysis extracted system_root configs
          REPORT="analysis/firmware_analysis.md"

          {
            echo "# B153 firmware analysis"
            echo
            echo "Generated by a read-only GitHub Actions workflow. Original release assets were not modified."
            echo
            echo "## Release assets"
            echo '```text'
            find downloaded -maxdepth 1 -type f -printf '%f\t%s bytes\n' | sort
            echo '```'
            echo
            echo "## SHA-256"
            echo '```text'
            sha256sum downloaded/*
            echo '```'
          } > "$REPORT"

          for asset in downloaded/*; do
            name="$(basename "$asset")"
            out="extracted/${name}.contents"
            mkdir -p "$out"
            if ! 7z x -y "$asset" -o"$out" >"analysis/7z_${name}.log" 2>&1; then
              echo "Could not extract $name with 7-Zip; keeping metadata only." >> "$REPORT"
            fi
          done

          {
            echo
            echo "## Extracted inventory"
            echo '```text'
            find extracted -type f -printf '%p\t%s bytes\n' | sort
            echo '```'
            echo
            echo "## File type summary"
            echo '```text'
            while IFS= read -r -d '' f; do
              printf '%s: ' "$f"
              file -b "$f" || true
            done < <(find extracted -type f -print0 | sort -z)
            echo '```'
          } >> "$REPORT"

          find extracted -type f \( -iname '*scatter*.txt' -o -iname 'build.prop' -o -iname 'default.prop' -o -iname 'fstab*' -o -iname 'init*.rc' -o -iname '*partition*.xml' \) -size -5M -print0 |
            while IFS= read -r -d '' f; do
              safe="configs/$(echo "$f" | sed 's#^extracted/##; s#[/ ]#_#g')"
              cp -a "$f" "$safe" || true
            done

          {
            echo
            echo "## MTK scatter and partition clues"
          } >> "$REPORT"
          while IFS= read -r -d '' scatter; do
            {
              echo
              echo "### $scatter"
              echo '```text'
              grep -E '^(platform:|project:|storage:|boot_channel:|block_size:|  partition_index:|  partition_name:|  file_name:|  is_download:|  type:|  linear_start_addr:|  physical_start_addr:|  partition_size:|  region:)' "$scatter" || true
              echo '```'
            } >> "$REPORT"
          done < <(find extracted -type f -iname '*scatter*.txt' -print0)

          {
            echo
            echo "## Android images"
            echo '```text'
          } >> "$REPORT"
          while IFS= read -r -d '' img; do
            printf '%s: ' "$img" >> "$REPORT"
            file -b "$img" >> "$REPORT" || true
          done < <(find extracted -type f \( -iname '*.img' -o -iname '*.bin' \) -print0 | sort -z)
          echo '```' >> "$REPORT"

          SYSTEM_IMG="$(find extracted -type f -iname 'system.img' -print -quit || true)"
          if [[ -n "$SYSTEM_IMG" ]]; then
            RAW_SYSTEM="$SYSTEM_IMG"
            MAGIC="$(xxd -p -l 4 "$SYSTEM_IMG" || true)"
            {
              echo
              echo "## system.img"
              echo
              echo "Path: \`$SYSTEM_IMG\`"
              echo
              echo "First four bytes: \`$MAGIC\`"
            } >> "$REPORT"

            if [[ "$MAGIC" == "3aff26ed" ]]; then
              RAW_SYSTEM="analysis/system.raw.img"
              simg2img "$SYSTEM_IMG" "$RAW_SYSTEM"
              echo "Detected Android sparse image and converted a working copy to raw format." >> "$REPORT"
            fi

            {
              echo
              echo "Raw image type:"
              echo '```text'
              file "$RAW_SYSTEM"
              echo '```'
              echo
              echo "Filesystem header:"
              echo '```text'
              sudo dumpe2fs -h "$RAW_SYSTEM" 2>&1 | head -120 || true
              echo '```'
            } >> "$REPORT"

            mkdir -p system_root
            7z x -y "$RAW_SYSTEM" -osystem_root > analysis/7z_system.log 2>&1 || true

            {
              echo
              echo "## Android build properties"
            } >> "$REPORT"
            while IFS= read -r -d '' prop; do
              {
                echo
                echo "### $prop"
                echo '```properties'
                grep -E '^(ro\.(build|product|hardware|board|boot|secure|debuggable|adb|crypto|treble|vendor)|persist\.|dalvik\.)' "$prop" | head -300 || true
                echo '```'
              } >> "$REPORT"
              cp -a "$prop" "configs/$(echo "$prop" | sed 's#[/ ]#_#g')" || true
            done < <(find system_root -type f \( -name 'build.prop' -o -name 'default.prop' \) -print0)

            {
              echo
              echo "## System applications"
              echo '```text'
              find system_root -type f -iname '*.apk' -printf '%p\n' | sort
              echo '```'
            } >> "$REPORT"
          fi

          {
            echo
            echo "## Boot and verification indicators"
            echo '```text'
            find extracted -type f \( -iname 'boot.img' -o -iname 'recovery.img' -o -iname 'vbmeta*.img' -o -iname '*verity*' \) -printf '%p\n' | sort
            echo '```'
            echo
            echo "Keyword scan:"
            echo '```text'
            while IFS= read -r -d '' f; do
              echo "--- $f"
              strings "$f" | grep -Eai 'androidboot|dm-verity|verity|avb|secureboot|verifiedboot|selinux|mt67|kernel version' | head -120 || true
            done < <(find extracted -type f \( -iname 'boot.img' -o -iname 'recovery.img' -o -iname 'vbmeta*.img' -o -iname '*scatter*.txt' \) -print0)
            echo '```'
          } >> "$REPORT"

          {
            echo
            echo "## Initial safety classification"
            echo
            echo "- Keep preloader, lk/bootloader, NVRAM, NVDATA, PROINFO, PROTECT and SECRO unchanged until hardware recovery and signature behavior are confirmed."
            echo "- Prefer initial experiments on copies of system/boot only, after confirming image format and verification checks."
            echo "- Do not flash any generated image solely on the basis of this automated report; inspect the report and preserve the original package first."
          } >> "$REPORT"

          tar -czf analysis/firmware-analysis-bundle.tar.gz analysis/firmware_analysis.md analysis/*.log configs 2>/dev/null || true
          sed -n '1,260p' "$REPORT"

      - name: Upload analysis report
        uses: actions/upload-artifact@v4
        with:
          name: firmware-analysis
          path: |
            analysis/firmware_analysis.md
            analysis/firmware-analysis-bundle.tar.gz
          retention-days: 7
