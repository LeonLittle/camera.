name: Analyze firmware

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install analysis tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            p7zip-full file binutils e2fsprogs android-sdk-libsparse-utils \
            abootimg jq tree cpio gzip lz4 xz-utils aapt apksigner

      - name: Download firmware release asset
        run: |
          mkdir -p downloaded
          gh release download firmware-v1 --repo "$GITHUB_REPOSITORY" --dir downloaded
          ls -lah downloaded

      - name: Deep read-only analysis
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p analysis extracted system_root boot_unpack boot_ramdisk selected_apks configs
          REPORT="analysis/deep_firmware_analysis.md"

          {
            echo "# B153 / T10s deep firmware analysis"
            echo
            echo "This workflow performs read-only inspection. It does not execute firmware binaries, modify release assets, or flash hardware."
            echo
            echo "## Release asset integrity"
            echo '```text'
            find downloaded -maxdepth 1 -type f -printf '%f\t%s bytes\n' | sort
            sha256sum downloaded/*
            echo '```'
          } > "$REPORT"

          for asset in downloaded/*; do
            name="$(basename "$asset")"
            out="extracted/${name}.contents"
            mkdir -p "$out"
            7z x -y "$asset" -o"$out" >"analysis/7z_${name}.log" 2>&1
          done

          SYSTEM_IMG="$(find extracted -type f -iname 'system.img' -print -quit || true)"
          BOOT_IMG="$(find extracted -type f -iname 'boot.img' -print -quit || true)"
          SCATTER="$(find extracted -type f -iname '*scatter*.txt' -print -quit || true)"

          {
            echo
            echo "## Core files"
            echo '```text'
            printf 'scatter=%s\nboot=%s\nsystem=%s\n' "$SCATTER" "$BOOT_IMG" "$SYSTEM_IMG"
            echo '```'
          } >> "$REPORT"

          if [[ -n "$SCATTER" ]]; then
            cp -a "$SCATTER" configs/
            {
              echo
              echo "## Scatter partition summary"
              echo '```text'
              grep -E '^(platform:|project:|storage:|boot_channel:|block_size:|  partition_index:|  partition_name:|  file_name:|  is_download:|  type:|  linear_start_addr:|  partition_size:|  region:)' "$SCATTER" || true
              echo '```'
            } >> "$REPORT"
          fi

          if [[ -n "$SYSTEM_IMG" ]]; then
            RAW_SYSTEM="$SYSTEM_IMG"
            MAGIC="$(xxd -p -l 4 "$SYSTEM_IMG" || true)"
            if [[ "$MAGIC" == "3aff26ed" ]]; then
              RAW_SYSTEM="analysis/system.raw.img"
              simg2img "$SYSTEM_IMG" "$RAW_SYSTEM"
            fi

            7z x -y "$RAW_SYSTEM" -osystem_root > analysis/7z_system.log 2>&1 || true

            {
              echo
              echo "## system image"
              echo '```text'
              file "$SYSTEM_IMG"
              file "$RAW_SYSTEM"
              sudo dumpe2fs -h "$RAW_SYSTEM" 2>&1 | head -80 || true
              echo '```'
              echo
              echo "## Android build and security properties"
              echo '```properties'
              while IFS= read -r -d '' prop; do
                echo "--- $prop"
                grep -E '^(ro\.(build|product|board|hardware|secure|debuggable|adb|crypto|treble|kernel|boot)|persist\.sys\.(usb|timezone)|persist\.service\.adb)' "$prop" || true
                cp -a "$prop" "configs/$(echo "$prop" | sed 's#[/ ]#_#g')" || true
              done < <(find system_root -type f \( -name 'build.prop' -o -name 'default.prop' \) -print0)
              echo '```'
            } >> "$REPORT"
          fi

          if [[ -n "$BOOT_IMG" ]]; then
            cp -a "$BOOT_IMG" analysis/boot.original.img
            (
              cd boot_unpack
              abootimg -x "../$BOOT_IMG" > ../analysis/abootimg_extract.log 2>&1
            ) || true

            {
              echo
              echo "## boot.img structure"
              echo '```text'
              file "$BOOT_IMG"
              if [[ -f boot_unpack/bootimg.cfg ]]; then cat boot_unpack/bootimg.cfg; fi
              if [[ -f boot_unpack/zImage ]]; then file boot_unpack/zImage; fi
              if [[ -f boot_unpack/initrd.img ]]; then file boot_unpack/initrd.img; fi
              echo '```'
            } >> "$REPORT"

            if [[ -f boot_unpack/initrd.img ]]; then
              RAMDISK_TYPE="$(file -b boot_unpack/initrd.img)"
              case "$RAMDISK_TYPE" in
                *gzip*) (cd boot_ramdisk && gzip -dc ../boot_unpack/initrd.img | cpio -idm --no-absolute-filenames) > analysis/ramdisk_extract.log 2>&1 || true ;;
                *LZ4*|*lz4*) (cd boot_ramdisk && lz4 -dc ../boot_unpack/initrd.img | cpio -idm --no-absolute-filenames) > analysis/ramdisk_extract.log 2>&1 || true ;;
                *XZ*|*xz*) (cd boot_ramdisk && xz -dc ../boot_unpack/initrd.img | cpio -idm --no-absolute-filenames) > analysis/ramdisk_extract.log 2>&1 || true ;;
                *) (cd boot_ramdisk && cpio -idm --no-absolute-filenames < ../boot_unpack/initrd.img) > analysis/ramdisk_extract.log 2>&1 || true ;;
              esac
            fi

            {
              echo
              echo "## Boot ramdisk inventory"
              echo '```text'
              find boot_ramdisk -maxdepth 3 -type f -printf '%p\n' | sort | head -500
              echo '```'
              echo
              echo "## fstab, init and verification clues"
              echo '```text'
              while IFS= read -r -d '' cfg; do
                echo "--- $cfg"
                grep -Eni '(^|[^a-z])(verify|verity|avb|forceencrypt|encryptable|mount|system|selinux|ro\.secure|ro\.debuggable|ro\.adb\.secure|persist\.sys\.usb\.config)' "$cfg" | head -240 || true
                cp -a "$cfg" "configs/$(echo "$cfg" | sed 's#[/ ]#_#g')" || true
              done < <(find boot_ramdisk -type f \( -name 'fstab*' -o -name 'init*.rc' -o -name 'default.prop' -o -name '*.prop' \) -print0)
              echo '```'
            } >> "$REPORT"
          fi

          if [[ -d system_root ]]; then
            mapfile -d '' APK_LIST < <(
              find system_root -type f -iname '*.apk' -print0 |
              grep -zE '/(JixiangLauncher|Launcher3|Camera|Gallery2|photo|SuperHearing|kdxxj_[^/]+|Settings|SystemUI)/[^/]+\.apk$' || true
            )

            {
              echo
              echo "## Selected APK metadata and certificates"
            } >> "$REPORT"

            for apk in "${APK_LIST[@]:-}"; do
              [[ -f "$apk" ]] || continue
              base="$(basename "$(dirname "$apk")")_$(basename "$apk")"
              cp -a "$apk" "selected_apks/$base"
              {
                echo
                echo "### $apk"
                echo '```text'
                aapt dump badging "$apk" 2>&1 | grep -E '^(package:|sdkVersion:|targetSdkVersion:|application-label:|launchable-activity:|native-code:)' | head -80 || true
                echo
                apksigner verify --print-certs "$apk" 2>&1 | head -80 || true
                echo
                echo "Manifest components and intent filters:"
                aapt dump xmltree "$apk" AndroidManifest.xml 2>&1 |
                  grep -E 'E: (activity|activity-alias|service|receiver|intent-filter)|A: android:name|android.intent.action.(MAIN|BOOT_COMPLETED)|android.intent.category.(HOME|LAUNCHER|DEFAULT)' |
                  head -260 || true
                echo '```'
              } >> "$REPORT"
            done

            {
              echo
              echo "## References to launchers and product packages"
              echo '```text'
              grep -RInaE 'JixiangLauncher|Launcher3|kdxxj_|SuperHearing|BOOT_COMPLETED|CATEGORY_HOME' system_root/etc system_root/vendor/etc 2>/dev/null | head -300 || true
              echo '```'
            } >> "$REPORT"
          fi

          {
            echo
            echo "## Preliminary modification verdict"
            echo
            echo "- The safest first modification target remains a copied system.img."
            echo "- Keep MediaTek kernel, camera HAL, audio HAL, Wi-Fi libraries and proprietary vendor libraries unchanged."
            echo "- Do not modify preloader, lk, trustzone, secro, nvram, nvdata, proinfo or protect partitions."
            echo "- Do not generate a flashable test image until the boot ramdisk mount flags and APK signing results above are reviewed."
          } >> "$REPORT"

          tar -czf analysis/firmware-deep-analysis-bundle.tar.gz \
            analysis/deep_firmware_analysis.md analysis/*.log configs selected_apks 2>/dev/null || true

          sed -n '1,360p' "$REPORT"

      - name: Upload deep analysis report
        uses: actions/upload-artifact@v4
        with:
          name: firmware-analysis-v2
          path: |
            analysis/deep_firmware_analysis.md
            analysis/firmware-deep-analysis-bundle.tar.gz
          retention-days: 7
